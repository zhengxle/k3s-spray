---
- name: K3s 集群搭建（前置准备 + 安装 + 离线镜像 + 私有仓库）
  hosts: k3s_cluster
  become: true
  vars_files:
    - vars/main.yml

  tasks:

    # ========== 阶段0-pre：配置 DNS ==========
    - name: 停止并禁用 systemd-resolved
      systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false   # 有些系统没装该服务，忽略失败
    - name: 解锁 /etc/resolv.conf (移除不可变属性)
      command: chattr -i /etc/resolv.conf
      register: chattr_unlock
      changed_when: chattr_unlock.rc == 0
      failed_when: false  # 如果文件本来就没锁定，忽略报错

    - name: 删除 systemd-resolved 留下的 resolv.conf 软链接
      file:
        path: /etc/resolv.conf
        state: absent

    - name: 写入自定义 DNS
      copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          nameserver 223.5.5.5
          nameserver 114.114.114.114


    # ========== 阶段0：节点前置准备（所有节点） ==========
    - name: 关闭 swap（立即生效）
      command: swapoff -a
      register: swap_off
      changed_when: swap_off.rc == 0
      failed_when: false

    - name: 注释 fstab 中的 swap 行（永久）
      replace:
        path: /etc/fstab
        regexp: '^(.*\sswap\s.*)$'
        replace: '#\1'

    - name: 写入 k3s 内核参数
      copy:
        dest: /etc/sysctl.d/k3s.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: 加载 br_netfilter 模块（bridge-nf 参数依赖）
      modprobe:
        name: br_netfilter
        state: present

    - name: 应用内核参数
      command: sysctl --system
      changed_when: true

    # ========== 阶段1a：安装 K3s Server ==========
    - name: 安装 K3s Server
      when: "'k3s_server' in group_names"
      shell: |
        curl -sfL https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | \
        INSTALL_K3S_MIRROR=cn sh -
      args:
        creates: /var/lib/rancher/k3s/server/node-token
      register: install_server
      changed_when: install_server.rc == 0

    - name: 读取集群 Token（server）
      when: "'k3s_server' in group_names"
      command: cat /var/lib/rancher/k3s/server/node-token
      register: node_token
      changed_when: false

    - name: 等待 server API 就绪
      when: "'k3s_server' in group_names"
      uri:
        url: "https://{{ hostvars['k3s-node1'].ansible_host }}:6443/ping"
        validate_certs: false
        status_code: [200, 401, 403]
      register: api_up
      retries: 30
      delay: 5
      until: api_up is succeeded
      delegate_to: k3s-node1

    # ========== 阶段1b：安装 K3s Agent ==========
    - name: 安装 K3s Agent
      when: "'k3s_agents' in group_names"
      shell: |
        curl -sfL https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | \
        INSTALL_K3S_MIRROR=cn \
        K3S_URL=https://{{ hostvars['k3s-node1'].ansible_host }}:6443 \
        K3S_TOKEN={{ hostvars['k3s-node1'].node_token.stdout }} \
        sh -
      args:
        creates: /etc/rancher/k3s
      register: install_agent
      changed_when: install_agent.rc == 0
    
    # ========== 阶段2.5：安装 Docker（仅 server，用于私有仓库） ==========
    - name: 安装 docker.io
      when:
        - "'k3s_server' in group_names"
        - setup_registry | bool
      apt:
        name: docker.io
        state: present
        update_cache: true

    - name: 启动并开机自启 docker
      when:
        - "'k3s_server' in group_names"
        - setup_registry | bool
      systemd:
        name: docker
        state: started
        enabled: true

    # ========== 阶段3：搭建私有仓库(仅 server) ==========
    - name: 搭建私有仓库
      when:
        - "'k3s_server' in group_names"
        - setup_registry | bool
      block:
        - name: 导入 registry:2 镜像
          command: docker load -i /home/{{ ansible_user }}/k3s-offline/files/registry.tar
          register: reg_load
          changed_when: "'Loaded image' in reg_load.stdout"

        - name: 为离线导入镜像打上 registry:2 标签
          shell: |
            img=$(echo '{{ reg_load.stdout }}' | grep -oE 'sha256:[0-9a-f]{12,}' | head -n1 | cut -d: -f2)
            if [ -n "$img" ]; then docker tag "$img" registry:2; fi
          register: reg_tag
          changed_when: reg_tag.stdout | default('') == ''

        - name: 启动 registry 容器
          docker_container:
            name: registry
            image: registry:2
            state: started
            restart_policy: always
            published_ports:
              - "{{ registry_port }}:5000"
            volumes:
              - /data/registry:/var/lib/registry

    # ========== 阶段4：配置 registries.yaml ==========
    - name: 确保 /etc/rancher/k3s 目录存在
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: 生成 registries.yaml(统一 DaoCloud 代理 + 按需附加私有仓库)
      template:
        src: templates/registries.yaml.j2
        dest: /etc/rancher/k3s/registries.yaml
        mode: "0644"


    - name: 重启服务使 registries.yaml 生效
      systemd:
        name: "{{ 'k3s' if 'k3s_server' in group_names else 'k3s-agent' }}"
        state: restarted

    # ========== 阶段6：健康校验(仅 server) ==========
    - name: 等待节点 Ready
      when: "'k3s_server' in group_names"
      command: kubectl get nodes --no-headers
      register: nodes_out
      retries: 30
      delay: 10
      until: "'NotReady' not in nodes_out.stdout"

    - name: 检查异常 Pod
      when: "'k3s_server' in group_names"
      shell: kubectl get pods -A --no-headers | grep -Ev 'Running|Completed' || true
      register: bad_pods

    - name: 输出健康报告
      when: "'k3s_server' in group_names"
      debug:
        msg:
          - "=== 节点状态 ==="
          - "{{ nodes_out.stdout }}"
          - "=== 异常 Pod(应为空) ==="
          - "{{ bad_pods.stdout | default('无') }}"
